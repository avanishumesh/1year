<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        <title>One Year ♡</title>
        <link
            href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Dancing+Script:wght@600&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --stars: 0;
                --cl: 0.7;
                --ink: #4a3a6a;
            }
            * {
                box-sizing: border-box;
                margin: 0;
            }
            body {
                font-family: "Fredoka", system-ui, sans-serif;
                color: var(--ink);
                background: #ffd2b0;
                overflow-x: hidden;
            }
            body.locked {
                overflow: hidden;
                height: 100vh;
                touch-action: none;
            }
            #sky,
            #orb,
            .stars,
            .cl {
                position: fixed;
                z-index: 0;
                pointer-events: none;
            }
            #sky {
                inset: 0;
            }
            #orb {
                width: 170px;
                height: 170px;
                border-radius: 50%;
                transform: translate(-50%, -50%);
                background: radial-gradient(
                    circle,
                    var(--oc) 22%,
                    transparent 68%
                );
            }
            .stars {
                inset: 0;
                opacity: var(--stars);
            }
            .stars i {
                position: absolute;
                width: 3px;
                height: 3px;
                border-radius: 50%;
                background: #fff;
                box-shadow: 0 0 6px #fff;
                animation: tw 3s infinite alternate;
            }
            @keyframes tw {
                from {
                    opacity: 0.2;
                }
                to {
                    opacity: 1;
                }
            }
            .cl {
                left: 0;
                width: 360px;
                height: 110px;
                border-radius: 60px;
                background: #fff;
                filter: blur(30px);
                opacity: var(--cl);
                animation: dr 70s linear infinite;
            }
            @keyframes dr {
                from {
                    transform: translateX(-420px);
                }
                to {
                    transform: translateX(110vw);
                }
            }
            #fx {
                position: fixed;
                inset: 0;
                z-index: 1;
                pointer-events: none;
            }
            #gl {
                position: fixed;
                inset: 0;
                z-index: 1;
                pointer-events: none;
                will-change: opacity;
            }
            main {
                position: relative;
                z-index: 2;
            }
            .hero {
                height: 100vh;
                display: flex;
                align-items: flex-end;
                justify-content: center;
                padding-bottom: 8vh;
            }
            .hint {
                font:
                    600 22px "Dancing Script",
                    cursive;
                color: #fff;
                text-shadow: 0 2px 14px rgba(120, 70, 160, 0.55);
                text-align: center;
                transition: opacity 0.3s;
            }
            .hint b {
                display: block;
                font-size: 26px;
                animation: bob 1.8s ease-in-out infinite;
            }
            @keyframes bob {
                50% {
                    transform: translateY(8px);
                }
            }
            .tl {
                position: relative;
                padding: 12vh 0 8vh;
            }
            .it {
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0 5vw;
            }
            .it.r {
                justify-content: center;
            }
            .card {
                width: min(74vw, 360px);
                background: rgba(255, 255, 255, 0.84);
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                padding: 12px 12px 16px;
                border-radius: 20px;
                box-shadow: 0 18px 50px rgba(120, 80, 160, 0.3);
                will-change: transform, opacity;
                -webkit-backface-visibility: hidden;
                backface-visibility: hidden;
            }
            .ph {
                aspect-ratio: 4/5;
                border-radius: 12px;
                overflow: hidden;
                background: linear-gradient(135deg, #ffd6e8, #d9c8ff);
                display: grid;
                place-items: center;
                font-size: 44px;
            }
            .ph img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .cap {
                font:
                    600 25px "Dancing Script",
                    cursive;
                margin-top: 10px;
                text-align: center;
            }
            .dt {
                font-size: 13px;
                opacity: 0.65;
                text-align: center;
                letter-spacing: 0.06em;
            }
            .end {
                height: 100vh;
                display: grid;
                place-items: center;
                text-align: center;
                padding: 0 8vw;
            }
            .end h2 {
                font:
                    600 clamp(38px, 9vw, 84px)/1.15 "Dancing Script",
                    cursive;
                color: #fff;
                text-shadow: 0 0 34px #c9a7ff;
            }
            .end p {
                margin-top: 14px;
                font-size: 20px;
                color: #efe7ff;
            }
            #lock {
                position: fixed;
                inset: 0;
                z-index: 10;
                display: grid;
                place-items: center;
                overflow: hidden;
                background: linear-gradient(
                    160deg,
                    #ffd6e8,
                    #e3d3ff 35%,
                    #bde0ff 65%,
                    #ffd6e8
                );
                background-size: 300% 300%;
                animation: lg 20s ease-in-out infinite;
                transition:
                    opacity 1.3s,
                    visibility 1.3s;
                touch-action: none;
            }
            @keyframes lg {
                50% {
                    background-position: 100% 100%;
                }
            }
            .lb {
                position: absolute;
                border-radius: 50%;
                filter: blur(55px);
                opacity: 0.6;
                pointer-events: none;
                animation: lbd 14s ease-in-out infinite;
            }
            @keyframes lbd {
                50% {
                    transform: translate(30px, -40px) scale(1.12);
                }
            }
            .fl {
                position: absolute;
                bottom: -70px;
                left: var(--x);
                pointer-events: none;
                opacity: 0;
                animation: rise var(--d) linear infinite;
                animation-delay: var(--dl);
            }
            @keyframes rise {
                0% {
                    opacity: 0;
                    transform: translate3d(0, 0, 0) rotate(0);
                }
                12% {
                    opacity: var(--o);
                }
                88% {
                    opacity: var(--o);
                }
                100% {
                    opacity: 0;
                    transform: translate3d(var(--dx), -118vh, 0)
                        rotate(var(--r));
                }
            }
            .fl.h,
            .bz.h {
                font:
                    var(--s)/1 system-ui,
                    sans-serif;
                color: var(--c);
                text-shadow: 0 0 14px var(--c);
            }
            .fl.p,
            .bz.p {
                width: var(--s);
                height: var(--s);
                background: linear-gradient(135deg, #fff, var(--c));
                border-radius: 70% 0 70% 0;
            }
            .bz {
                position: absolute;
                z-index: 3;
                pointer-events: none;
            }
            #lock.off {
                opacity: 0;
                visibility: hidden;
            }
            .box {
                position: relative;
                z-index: 1;
                text-align: center;
                padding: 30px 26px 22px;
                border-radius: 32px;
                background: rgba(255, 255, 255, 0.42);
                border: 1px solid rgba(255, 255, 255, 0.75);
                backdrop-filter: blur(18px);
                -webkit-backdrop-filter: blur(18px);
                box-shadow:
                    0 24px 70px rgba(150, 100, 200, 0.32),
                    inset 0 0 40px rgba(255, 255, 255, 0.45);
                width: min(88vw, 360px);
            }
            .heart {
                font-size: 54px;
                animation: bt 1.6s infinite;
                filter: drop-shadow(0 6px 16px rgba(255, 140, 190, 0.75));
            }
            @keyframes bt {
                50% {
                    transform: scale(1.15);
                }
            }
            .box h1 {
                font:
                    600 38px "Dancing Script",
                    cursive;
                margin: 4px 0 2px;
                text-shadow: 0 2px 16px rgba(255, 255, 255, 0.9);
            }
            .sub {
                font-size: 15px;
                opacity: 0.7;
                margin-bottom: 18px;
            }
            input {
                width: 100%;
                padding: 14px 18px;
                border: 2px solid rgba(255, 255, 255, 0.9);
                border-radius: 999px;
                font: inherit;
                font-size: 17px;
                text-align: center;
                color: var(--ink);
                background: rgba(255, 255, 255, 0.7);
                outline: none;
                box-shadow: 0 4px 18px rgba(181, 138, 224, 0.18);
            }
            input:focus-visible {
                border-color: #b58ae0;
                box-shadow: 0 0 0 4px rgba(181, 138, 224, 0.25);
            }
            button {
                font: inherit;
                cursor: pointer;
            }
            #go {
                margin-top: 12px;
                width: 100%;
                padding: 14px;
                border: 0;
                border-radius: 999px;
                background: linear-gradient(135deg, #ff9ec4, #b58ae0);
                color: #fff;
                font-size: 17px;
                font-weight: 600;
                box-shadow: 0 8px 22px rgba(255, 140, 190, 0.5);
                transition:
                    transform 0.15s,
                    box-shadow 0.15s;
            }
            #go:active {
                transform: scale(0.97);
            }
            #go:focus-visible,
            #snd:focus-visible {
                outline: 3px solid #fff;
                outline-offset: 2px;
            }
            #msg {
                min-height: 22px;
                margin-top: 10px;
                font-size: 14px;
                opacity: 0.8;
            }
            .shake {
                animation: sh 0.4s;
            }
            @keyframes sh {
                25% {
                    transform: translateX(-10px);
                }
                75% {
                    transform: translateX(10px);
                }
            }
            #snd {
                position: fixed;
                right: 14px;
                top: max(14px, env(safe-area-inset-top));
                z-index: 5;
                width: 44px;
                height: 44px;
                border-radius: 50%;
                border: 0;
                background: rgba(255, 255, 255, 0.7);
                backdrop-filter: blur(8px);
                font-size: 20px;
            }
            @media (prefers-reduced-motion: reduce) {
                .cl,
                .stars i,
                .hint b,
                .heart,
                #lock,
                .lb {
                    animation: none;
                }
                .fl {
                    display: none;
                }
            }
        </style>
    </head>

            /* ============ END OF EDITS ============ */

            const $ = (id) => document.getElementById(id);
            history.scrollRestoration = "manual";
            scrollTo(0, 0);
            $("sub").textContent = LOCK_SUB;
            $("endT").textContent = END_TEXT;
            $("endN").textContent = NAMES;

            /* timeline */
            const tl = $("tl");
            PHOTOS.forEach((p, i) => {
                const it = document.createElement("div");
                it.className = "it" + (i % 2 ? " r" : "");
                const img = p.src
                    ? `<img src="${p.src}" alt="${p.caption}">`
                    : `🤍`;
                it.innerHTML = `<div class="card"><div class="ph">${img}</div><div class="cap">${p.caption}</div><div class="dt">${p.date}</div></div>`;

            const items = [...tl.children];

            /* stars */
            for (let i = 0; i < 110; i++) {
                const s = document.createElement("i");
                s.style.cssText = `left:${Math.random() * 100}%;top:${Math.random() * 75}%;animation-delay:${-Math.random() * 3}s`;

            /* lock + sound */
            const audio = AUDIO_SRC ? new Audio(AUDIO_SRC) : null;
            if (audio) {
                audio.loop = true;
                audio.volume = 0.6;
            }
            const setSnd = (on) => {
                $("snd").textContent = on ? "🔊" : "🔇";
            };
            $("snd").onclick = () => {
                if (!audio) return;
                if (audio.paused)
                    audio
                        .play()
                        .then(() => setSnd(true))
                        .catch(() => {});
                else {
                    audio.pause();
                    setSnd(false);
                }
            };
            let opened = false;
            function unlock() {
                if (opened) return;
                if (
                    $("pw").value.trim().toLowerCase() ===
                    PASSWORD.toLowerCase()
                ) {
                    opened = true;
                    $("pw").blur();
                    if (audio)
                        audio
                            .play()
                            .then(() => setSnd(true))
                            .catch(() => {});
                    burst();
                    $("box").animate(
                        [
                            { transform: "scale(1)", opacity: 1 },
                            { transform: "scale(1.08)", opacity: 0 },
                        ],
                        { duration: 600, easing: "ease-in", fill: "forwards" },
                    );
                    setTimeout(() => {
                        $("lock").classList.add("off");
                        document.body.classList.remove("locked");
                        updatePositions();
                    }, 700);
                } else {
                    const b = $("box");
                    b.classList.remove("shake");
                    void b.offsetWidth;
                    b.classList.add("shake");
                    $("msg").textContent = "Not quite. " + HINT;
                }
            }
            $("go").onclick = unlock;
            $("pw").addEventListener("keydown", (e) => {
                if (e.key === "Enter") unlock();
            });

            /* sky journey: dawn → day → sunset → night */
            const hx = (h) =>
                [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));
            const S = [
                [hx("#e9a5d0"), hx("#ffd2b0"), hx("#ffb98a"), 0.7, 0],
                [hx("#8fcaf7"), hx("#e6f6ff"), hx("#fff3a8"), 0.85, 0],
                [hx("#b58ae0"), hx("#ffb3a0"), hx("#ff9a7a"), 0.7, 0],
                [hx("#17163f"), hx("#4b3b80"), hx("#f3f1ff"), 0.12, 1],
            ];
            const mix = (a, b, t) =>
                a.map((v, i) => Math.round(v + (b[i] - v) * t));
            const num = (a, b, t) => a + (b - a) * t;
            const root = document.documentElement.style;
            function sky(p) {
                const f = Math.min(p, 0.9999) * 3,
                    i = Math.floor(f);
                let t = f - i;
                t = t * t * (3 - 2 * t);
                const A = S[i],
                    B = S[i + 1];
                $("sky").style.background =
                    `linear-gradient(rgb(${mix(A[0], B[0], t)}),rgb(${mix(A[1], B[1], t)}))`;
                $("orb").style.setProperty(
                    "--oc",
                    `rgb(${mix(A[2], B[2], t)})`,
                );
                $("orb").style.left = 15 + 70 * p + "vw";
                $("orb").style.top =
                    78 - 55 * Math.sin(Math.PI * p * 0.85) + "vh";
                root.setProperty("--cl", num(A[3], B[3], t));
                root.setProperty("--stars", num(A[4], B[4], t));
            }

            /* helpers */
            const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
            const rnd = (a, b) => a + Math.random() * (b - a);
            const RM = matchMedia("(prefers-reduced-motion:reduce)").matches;

            /* password page: floating hearts + petals, and the burst on unlock */
            const LC = ["#ff9ec4", "#ffc2dc", "#c9a7ff", "#a9d2ff", "#ffffff"];
            function bit(cls) {
                const e = document.createElement("i"),
                    h = Math.random() < 0.4;
                e.className = cls + (h ? " h" : " p");
                if (h) e.textContent = "♥\uFE0E";
                return [e, h];
            }
            if (!RM)
                for (let i = 0; i < 24; i++) {
                    const [e] = bit("fl");
                    e.style.cssText = `--x:${rnd(0, 100)}%;--s:${rnd(14, 34)}px;--c:${LC[i % LC.length]};--o:${rnd(0.45, 0.9)};--d:${rnd(11, 22)}s;--dl:${-rnd(0, 22)}s;--dx:${rnd(-80, 80)}px;--r:${rnd(-200, 200)}deg`;
                    $("lock").appendChild(e);
                }
            function burst() {
                const r = $("box").getBoundingClientRect(),
                    cx = r.left + r.width / 2,
                    cy = r.top + r.height / 2;
                const reach = Math.max(innerWidth, innerHeight) * 0.55;
                for (let i = 0; i < (RM ? 14 : 56); i++) {
                    const [e] = bit("bz"),
                        a = rnd(0, 6.283),
                        dist = rnd(0.25, 1) * reach;
                    e.style.cssText = `left:${cx}px;top:${cy}px;--s:${rnd(16, 38)}px;--c:${LC[i % LC.length]}`;
                    $("lock").appendChild(e);
                    const dx = Math.cos(a) * dist,
                        dy = Math.sin(a) * dist + rnd(40, 160);
                    e.animate(
                        [
                            {
                                transform:
                                    "translate(-50%,-50%) scale(.3) rotate(0deg)",
                                opacity: 1,
                            },
                            {
                                transform: `translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px)) scale(${rnd(1, 1.7)}) rotate(${rnd(-320, 320)}deg)`,
                                opacity: 0,
                            },
                        ],
                        {
                            duration: rnd(1100, 1900),
                            delay: rnd(0, 160),
                            easing: "cubic-bezier(.15,.7,.3,1)",
                            fill: "forwards",
                        },
                    ).onfinish = () => e.remove();
                }
            }

            /* 3D title: rose-gold foil balloon letters */
            const R = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            R.setPixelRatio(Math.min(devicePixelRatio, 2));
            $("gl").appendChild(R.domElement);
            const sc = new THREE.Scene(),
                cam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
            const grp = new THREE.Group();
            sc.add(grp);
            const letters = [],
                mats = {};

            function balloon(ch) {
                const S = 256,
                    c = document.createElement("canvas");
                c.width = c.height = S;
                const x = c.getContext("2d"),
                    cx = S / 2,
                    cy = S / 2 + 6;
                x.font =
                    '700 190px Fredoka, "Arial Rounded MT Bold", sans-serif';
                x.textAlign = "center";
                x.textBaseline = "middle";
                x.lineJoin = "round";
                /* puffy body with a soft shadow so it reads on any sky */
                x.shadowColor = "rgba(80,30,90,.5)";
                x.shadowBlur = 16;
                x.shadowOffsetY = 6;
                x.strokeStyle = "#c4808a";
                x.lineWidth = 22;
                x.strokeText(ch, cx, cy);
                x.shadowColor = "transparent";
                const g = x.createLinearGradient(0, 40, 0, 220);
                g.addColorStop(0, "#ffe6d8");
                g.addColorStop(0.5, "#f6bba8");
                g.addColorStop(1, "#d98c92");
                x.fillStyle = g;
                x.fillText(ch, cx, cy);
                /* inflated edges: layered darkening, rim light, glossy highlight */
                x.globalCompositeOperation = "source-atop";
                [30, 22, 15, 9].forEach((w) => {
                    x.strokeStyle = "rgba(120,50,70,.14)";
                    x.lineWidth = w;
                    x.strokeText(ch, cx, cy);
                });
                x.strokeStyle = "rgba(255,255,255,.6)";
                x.lineWidth = 3;
                x.strokeText(ch, cx + 4, cy + 5);
                const h = x.createRadialGradient(
                    cx - 30,
                    cy - 50,
                    0,
                    cx - 30,
                    cy - 50,
                    62,
                );
                h.addColorStop(0, "rgba(255,255,255,.6)");
                h.addColorStop(1, "rgba(255,255,255,0)");
                x.fillStyle = h;
                x.fillRect(0, 0, S, S);
                x.fillStyle = "rgba(255,255,255,.9)";
                x.beginPath();
                x.arc(cx - 44, cy - 60, 4, 0, 6.3);
                x.fill();
                return new THREE.MeshBasicMaterial({
                    map: new THREE.CanvasTexture(c),
                    transparent: true,
                    depthWrite: false,
                });
            }
            function build() {
                const W = 1024,
                    H = 640,
                    k = 14 / W,
                    m = document.createElement("canvas").getContext("2d");
                const font = (s) =>
                    `700 ${s}px Fredoka, "Arial Rounded MT Bold", sans-serif`;
                const L = TITLE.map((t) => {
                    m.font = font(200);
                    return Math.min(
                        150,
                        (200 * (W - 120)) / (m.measureText(t).width * 1.1),
                    );
                });
                let y = (H - L.reduce((a, s) => a + s * 1.1, 0)) / 2;
                TITLE.forEach((t, li) => {
                    const s = L[li],
                        cs = [...t];
                    m.font = font(s);
                    const w = cs.map(
                        (ch) => m.measureText(ch).width + s * 0.05,
                    );
                    let xp = (W - w.reduce((a, b) => a + b, 0)) / 2;
                    y += s * 0.55;
                    cs.forEach((ch, i) => {
                        if (ch !== " ") {
                            const sz = ((256 * s) / 190) * k,
                                mesh = new THREE.Mesh(
                                    new THREE.PlaneGeometry(sz, sz),
                                    mats[ch] || (mats[ch] = balloon(ch)),
                                );
                            mesh.position.set(
                                (xp + w[i] / 2 - W / 2) * k,
                                -(y - H / 2) * k,
                                0,
                            );
                            mesh.userData = {
                                x: mesh.position.x,
                                y: mesh.position.y,
                                p: Math.random() * 6.28,
                            };
                            grp.add(mesh);
                            letters.push(mesh);
                        }
                        xp += w[i];
                    });
                    y += s * 0.55;
                });
            }
            Promise.race([
                document.fonts.load("700 100px Fredoka"),
                new Promise((r) => setTimeout(r, 2500)),
            ]).then(build, build);

            /* cherry blossom petals + fireflies (2D overlay) */
            const fx = $("fx"),
                fc = fx.getContext("2d");
            const sprite = (draw) => {
                const c = document.createElement("canvas");
                c.width = c.height = 64;
                draw(c.getContext("2d"));
                return c;
            };
            const petal = (col) =>
                sprite((x) => {
                    x.translate(32, 32);
                    const g = x.createLinearGradient(0, 26, 0, -26);
                    g.addColorStop(0, "#fff");
                    g.addColorStop(1, col);
                    x.fillStyle = g;
                    x.beginPath();
                    x.moveTo(0, 26);
                    x.bezierCurveTo(-28, 12, -22, -22, -5, -26);
                    x.lineTo(0, -19);
                    x.lineTo(5, -26);
                    x.bezierCurveTo(22, -22, 28, 12, 0, 26);
                    x.fill();
                });
            const PET = [petal("#ffa9cb"), petal("#b996f0")];
            const glow = sprite((x) => {
                const g = x.createRadialGradient(32, 32, 0, 32, 32, 32);
                g.addColorStop(0, "rgba(255,250,170,1)");
                g.addColorStop(0.22, "rgba(220,255,120,.55)");
                g.addColorStop(1, "rgba(200,255,100,0)");
                x.fillStyle = g;
                x.fillRect(0, 0, 64, 64);
            });
            const petals = Array.from({ length: RM ? 16 : 40 }, () => ({
                x: rnd(0, 1),
                y: rnd(0, 1),
                s: rnd(14, 30),
                r: rnd(0, 6.28),
                vr: rnd(-0.8, 0.8),
                v: rnd(0.03, 0.07),
                ph: rnd(0, 6.28),
                sw: rnd(0.02, 0.05),
                a: rnd(0.55, 0.95),
            }));
            const flies = Array.from({ length: RM ? 10 : 26 }, () => ({
                x: rnd(0, 1),
                y: rnd(0.2, 1),
                s: rnd(22, 46),
                ph: rnd(0, 6.28),
                sp: rnd(0.4, 1),
                bl: rnd(0.6, 1.6),
            }));
            let FW = 0,
                FH = 0;
            function fxSize() {
                const d = Math.min(devicePixelRatio, 2);
                FW = innerWidth;
                FH = innerHeight;
                fx.width = FW * d;
                fx.height = FH * d;
                fc.setTransform(d, 0, 0, d, 0, 0);
            }
            function drawFx(t, dt, p, boost) {
                fc.clearRect(0, 0, FW, FH);
                const pp = p * p * (3 - 2 * p); // pink → twilight lilac as the day ends
                for (const q of petals) {
                    q.y += q.v * (1 + boost * 3) * dt;
                    q.x +=
                        (Math.sin(t * 0.0009 + q.ph) * q.sw +
                            0.012 +
                            boost * 0.02) *
                        dt;
                    q.r += q.vr * dt * (1 + boost * 2);
                    if (q.y > 1.08) {
                        q.y = -0.08;
                        q.x = rnd(-0.1, 1);
                    }
                    if (q.x > 1.1) q.x = -0.1;
                    fc.save();
                    fc.translate(q.x * FW, q.y * FH);
                    fc.rotate(q.r);
                    fc.scale(Math.abs(Math.cos(q.r * 0.7)) * 0.7 + 0.3, 1);
                    if (pp < 0.99) {
                        fc.globalAlpha = q.a * (1 - pp);
                        fc.drawImage(PET[0], -q.s / 2, -q.s / 2, q.s, q.s);
                    }
                    if (pp > 0.01) {
                        fc.globalAlpha = q.a * pp * 0.85;
                        fc.drawImage(PET[1], -q.s / 2, -q.s / 2, q.s, q.s);
                    }
                    fc.restore();
                }
                const n = clamp((p - 0.55) / 0.35, 0, 1); // fireflies come out at dusk
                if (n > 0.01) {
                    fc.globalCompositeOperation = "lighter";
                    for (const f of flies) {
                        const px =
                            f.x +
                            Math.sin(t * 0.00021 * f.sp + f.ph) * 0.06 +
                            Math.sin(t * 0.00057 * f.sp + f.ph * 2) * 0.02;
                        const py =
                            f.y +
                            Math.cos(t * 0.00017 * f.sp + f.ph * 1.3) * 0.05 +
                            Math.sin(t * 0.0005 * f.sp) * 0.015;
                        fc.globalAlpha =
                            n *
                            (Math.pow(
                                Math.max(0, Math.sin(t * 0.0012 * f.bl + f.ph)),
                                2,
                            ) *
                                0.8 +
                                0.2);
                        fc.drawImage(
                            glow,
                            px * FW - f.s / 2,
                            py * FH - f.s / 2,
                            f.s,
                            f.s,
                        );
                    }
                    fc.globalCompositeOperation = "source-over";
                }
                fc.globalAlpha = 1;
            }

            let itemCenters = [];
            function updatePositions() {
                const sy = scrollY;
                itemCenters = items.map((it) => {
                    const r = it.getBoundingClientRect();
                    return r.top + sy + r.height / 2;
                });
            }

            function resize() {
                const w = innerWidth,
                    h = innerHeight,
                    a = w / h;
                R.setSize(w, h);
                cam.aspect = a;
                cam.position.z = Math.max(14, 18.7 / a);
                cam.updateProjectionMatrix();
                fxSize();
                updatePositions();
            }
            addEventListener("resize", resize);
            resize();
            let mx = 0,
                my = 0,
                tx = 0,
                ty = 0;
            addEventListener("pointermove", (e) => {
                tx = e.clientX / innerWidth - 0.5;
                ty = e.clientY / innerHeight - 0.5;
            });

            /* smooth scrolling for mouse wheel (preserves native touch and trackpad momentum) */
            let targetScroll = scrollY;
            let isSmoothWheel = false;
            addEventListener(
                "wheel",
                (e) => {
                    if (document.body.classList.contains("locked")) return;
                    // If trackpad or pinch (continuous small pixel deltas or ctrlKey), preserve native
                    if (
                        e.ctrlKey ||
                        (Math.abs(e.deltaY) < 30 && e.deltaMode === 0)
                    ) {
                        targetScroll = scrollY;
                        isSmoothWheel = false;
                        return;
                    }
                    e.preventDefault();
                    const max = Math.max(
                        0,
                        document.documentElement.scrollHeight - innerHeight,
                    );
                    targetScroll = clamp(targetScroll + e.deltaY, 0, max);
                    isSmoothWheel = true;
                },
                { passive: false },
            );

            /* main loop: smoothed scroll drives sky, title, petals and photos */
            let cur = 0,
                last = 0;
            function frame(t) {
                const dt = Math.min(0.05, (t - last) / 1000);
                last = t;

                if (isSmoothWheel) {
                    const diff = targetScroll - scrollY;
                    if (Math.abs(diff) > 0.5) {
                        scrollTo(0, scrollY + diff * (1 - Math.exp(-14 * dt)));
                    } else {
                        scrollTo(0, targetScroll);
                        isSmoothWheel = false;
                    }
                } else {
                    targetScroll = scrollY;
                }

                const sy = scrollY,
                    vh = innerHeight,
                    max = Math.max(
                        1,
                        document.documentElement.scrollHeight - vh,
                    );
                cur += (sy - cur) * (1 - Math.exp(-8 * dt));
                const p = clamp(cur / max, 0, 1);
                sky(p);
                drawFx(t, dt, p, clamp(Math.abs(sy - cur) / 500, 0, 1.5));

                mx += (tx - mx) * (1 - Math.exp(-8 * dt));
                my += (ty - my) * (1 - Math.exp(-8 * dt));
                if (letters.length) {
                    const titleFade = clamp(1 - cur / (vh * 0.55), 0, 1);
                    const glEl = $("gl");
                    if (titleFade > 0) {
                        if (glEl.style.display === "none")
                            glEl.style.display = "block";
                        glEl.style.opacity = titleFade;
                        grp.visible = true;
                        const amp = RM ? 0 : 1;
                        for (const k in mats) mats[k].opacity = titleFade;
                        for (const l of letters) {
                            const u = l.userData;
                            l.position.y =
                                u.y + Math.sin(t * 0.0012 + u.p) * 0.16 * amp;
                            l.rotation.z =
                                Math.sin(t * 0.0009 + u.p * 1.7) * 0.07 * amp;
                        }
                        grp.position.y = (1 - titleFade) * 7.5;
                        grp.rotation.y = mx * 0.35;
                        grp.rotation.x = my * 0.2;
                        R.render(sc, cam);
                    } else {
                        if (glEl.style.display !== "none") {
                            glEl.style.display = "none";
                            glEl.style.opacity = "0";
                            grp.visible = false;
                            R.clear();
                        }
                    }
                }
                $("hint").style.opacity = clamp(1 - cur / (vh * 0.25), 0, 1);

                const vhCenter = sy + vh / 2;
                const RANGE = vh * 0.72;
                const maxDist = Math.min(innerWidth * 0.36, 260);

                for (let i = 0; i < items.length; i++) {
                    const it = items[i],
                        card = it.firstChild;
                    const itemCenter =
                        itemCenters[i] ||
                        it.getBoundingClientRect().top +
                            sy +
                            it.offsetHeight / 2;
                    const d = itemCenter - vhCenter;
                    const side = i % 2 === 1 ? 1 : -1;
                    const u = d / RANGE;
                    const absU = Math.abs(u);

                    if (absU > 1.12) {
                        if (card.style.opacity !== "0") {
                            card.style.opacity = 0;
                            card.style.visibility = "hidden";
                        }
                        continue;
                    }
                    card.style.visibility = "visible";

                    // Constantly moves throughout the scroll, smoothly reaching the exact center horizontally & vertically
                    const s = Math.pow(Math.min(1, absU), 1.35);
                    const dir = d > 0 ? side : -side;
                    const xOffset = dir * s * maxDist;
                    const yOffset = -d * 0.22; // continuous smooth parallax glide
                    const rot = dir * s * 6.5;
                    const scale = 1 - s * 0.12;
                    const op = Math.max(
                        0,
                        1 - Math.pow(Math.min(1, absU), 1.7),
                    );

                    card.style.opacity = op.toFixed(3);
                    card.style.transform = `translate3d(${xOffset.toFixed(1)}px,${yOffset.toFixed(1)}px,0) rotate(${rot.toFixed(2)}deg) scale(${scale.toFixed(3)})`;
                }
                requestAnimationFrame(frame);
            }
            requestAnimationFrame(frame);
        </script>
    </body>
</html>
